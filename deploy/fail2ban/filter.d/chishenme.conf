# fail2ban filter for the meal planner login log.
#
# The service writes one line per rejected login:
#   chishenme: login failed for "zip" from 203.0.113.7
# The attempted username is quoted with Go's %q, so it stays on one line.

[Definition]

failregex = ^(?:.*\s)?chishenme: login failed for .* from <HOST>\s*$

ignoreregex =

journalmatch = _SYSTEMD_UNIT=chishenme.service
